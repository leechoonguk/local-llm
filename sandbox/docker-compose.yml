# The compose project name, and therefore the prefix on every container, volume
# and network this stack creates (`fast-api-standard_pgdata`, …). Declared
# rather than derived: without it compose uses the directory name, so renaming
# the checkout or cloning it elsewhere silently creates a second, empty set of
# volumes and the database looks wiped. A sibling stack on this machine pins its
# own name for the same reason.
name: local-llm-sandbox

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host side is configurable: a developer with a local PostgreSQL cannot
      # start the stack when 25432 is taken. The container side is fixed — every
      # in-network URL (DATABASE_URL, Phoenix) names it.
      - "${POSTGRES_PORT:-25432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-26379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PHOENIX_SQL_DATABASE_SCHEMA: ${PHOENIX_SQL_DATABASE_SCHEMA}
      PHOENIX_HOST: "0.0.0.0"
    ports:
      - "${PHOENIX_UI_PORT:-26006}:6006"     # UI + OTLP HTTP collector
      - "${PHOENIX_GRPC_PORT:-24317}:4317"   # OTLP gRPC collector
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    # The whole root .env is handed to the container instead of one key per
    # line. A per-key list is a second declaration of the settings schema, and
    # it silently drops whatever nobody remembered to add: SECRET_KEY was
    # missing here, so the container crash-looped on a Pydantic "Field
    # required" while every other check passed. `settings.py` ignores extras,
    # so a root-only infra key (POSTGRES_*) is harmless.
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-28000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-25173}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
