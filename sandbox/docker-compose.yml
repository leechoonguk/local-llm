name: local-llm-sandbox

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PHOENIX_SQL_DATABASE_SCHEMA: ${PHOENIX_SQL_DATABASE_SCHEMA}
      PHOENIX_HOST: "0.0.0.0"
    ports:
      - "16006:6006"     # UI + OTLP HTTP collector
      - "14317:4317"     # OTLP gRPC collector
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      APP_NAME: ${APP_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ITEMS_PER_USER: ${ITEMS_PER_USER}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      ENV: ${ENV}
      INTEGRATION_TIMEOUT_SECONDS: ${INTEGRATION_TIMEOUT_SECONDS}
      INTEGRATION_CONNECT_TIMEOUT_SECONDS: ${INTEGRATION_CONNECT_TIMEOUT_SECONDS}
      INTEGRATION_MAX_RETRIES: ${INTEGRATION_MAX_RETRIES}
      INTEGRATION_RETRY_BASE_SECONDS: ${INTEGRATION_RETRY_BASE_SECONDS}
      INTEGRATION_RETRY_MAX_SECONDS: ${INTEGRATION_RETRY_MAX_SECONDS}
    ports:
      - "18000:18000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "15173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
