id: transaction-service-only
valid:
  - |
    async def get_batch(session: AsyncSession, batch_id: UUID) -> Batch:
        return await session.get(Batch, batch_id)
invalid:
  - |
    async def delete_batch(batch_id: UUID) -> None:
        async with session.begin():
            await session.delete(batch_id)
  - |
    async def delete_batch(self, batch_id: UUID) -> None:
        async with self.session.begin():
            await self.session.delete(batch_id)
