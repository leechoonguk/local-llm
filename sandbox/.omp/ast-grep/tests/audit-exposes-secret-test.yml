id: infra-audit-exposes-secret
valid:
  - |
    async def list_audit(user_service: UserServiceDep) -> list[AuditReadResponse]:
        return [AuditReadResponse(created_by=row.created_by) for row in rows]
invalid:
  - |
    async def list_audit(user_service: UserServiceDep) -> list[dict]:
        return [{"hashed_password": row.hashed_password} for row in rows]
