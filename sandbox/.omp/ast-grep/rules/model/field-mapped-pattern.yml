id: model-field-mapped-pattern
language: python
# A plain annotation is invisible to SQLAlchemy: the attribute exists on the
# class, no column exists in the table, and autogenerate produces an empty
# migration. `Mapped[...] = mapped_column(...)` is what makes a field a column,
# and `Mapped[...] = relationship(...)` is what makes it a related collection.
#
# Relationships used to be excluded by *filename* — `check-backend-domain` skipped
# `models/integration.py` because it was the one file with relationships. Splitting
# that aggregate into one file per table made the workaround visible: the rule was
# too narrow, not the file special.
rule:
  pattern: "$NAME: $TYPE = $VALUE"
  not:
    any:
      - pattern: "$NAME: Mapped[$FTYPE] = mapped_column($$$ARGS)"
      - pattern: "$NAME: Mapped[$FTYPE] = relationship($$$ARGS)"
message: "model fields must use Mapped[X] = mapped_column(...) or Mapped[X] = relationship(...)"
