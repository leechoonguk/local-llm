id: offload-password-hash
language: python
# argon2 costs ~25 ms of CPU per hash and per verify (measured). Called straight
# from async code it holds the event loop for that long, so every other request
# in the process waits — a login burst serializes the whole worker. The call goes
# to a worker thread; passing the function as a reference to
# `to_thread.run_sync` is not a call, so the compliant form does not match.
rule:
  any:
    - pattern: hash_password($$$ARGS)
    - pattern: verify_password($$$ARGS)
owns:
  - "hash_password("
message: "hash/verify must run off the event loop — await to_thread.run_sync(hash_password, ...) (backend-auth.md)"
