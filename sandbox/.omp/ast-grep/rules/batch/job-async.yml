id: batch-job-async
language: python
# A sync job blocks the scheduler thread, so one slow query delays every other
# job. `expect`-free negative form: any `def` that is not `async def` and not a
# dunder is the violation.
rule:
  kind: function_definition
  regex: "^def \\w+\\("
  not:
    any:
      - regex: "^async def \\w+\\("
      - regex: "^def __init__\\("
message: "batch job function must be async def"
