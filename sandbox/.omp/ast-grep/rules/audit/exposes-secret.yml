id: infra-audit-exposes-secret
language: python
# Structural: the credential hash must not be reachable from the audit endpoint —
# neither read off a model (`row.hashed_password`) nor named as a key or column
# (`"hashed_password"`). Matching the identifier itself, not a text pattern,
# means a rename of the column is a rule change, not a silently passing regex.
rule:
  any:
    - pattern: $A.hashed_password
    - pattern: hashed_password
    - pattern: '"hashed_password"'
owns:
  - "hashed_password"
message: "audit endpoint must never expose hashed_password"
