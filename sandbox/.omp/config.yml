# Project-local OMP settings.
# See `omp://settings.md` for the full catalog and precedence rules.

bashInterceptor:
  enabled: true

# ── Post hooks: disabled per tool call, run once as the closing gate ──────────
#
# 실측(`make hook-report`, 125 세션 / 변이 도구 호출 18,760건): post 훅 52개가
# 호출 하나에 평균 3.8초를 썼고 누적 71,543초였다. 그중 check-verify 가 33,526초(47%),
# api-http·integration-configuration·ledger 세 트리 스캐너가 23,514초(33%)다.
# 세션당 약 570초 — 편집마다 전체 트리를 다시 읽은 값이다.
#
# 같은 52개 검사는 루트 `make verify` 의 선행 타깃으로 전부 들어 있고(52/52 일치),
# 루트 `make verify` 한 번은 52초다(초록 2회 실측 52.2/53.1초). 테스트 워커 병렬(36→12.6초)과
# 두 게이트 동시 실행(52.3→19.4초)으로 85→52초가 됐고, `make -j8 verify` 는 21.0초다.
# 손익분기는 변이 호출 14건 — 실제 세션은 그 10배를 넘는다(평균 ~150건).
#
# 그래서 자동 실행만 끈다. 파일·make 타깃·마감 게이트는 그대로다:
#   - pre/strict-* 훅은 살아 있다(파괴적 작업을 *막는* 장치라 사후 검사로 대체 불가)
#   - continuity 확장의 마감 게이트가 마지막 변경 이후 루트 게이트 미실행 종료를 막는다
#
# id 형식은 `hook:<type>:<tool>:<name>` (omp://extension-loading.md, 훅 capability
# toExtensionId). 배열은 전역 설정을 확장하지 않고 **대체**한다.
