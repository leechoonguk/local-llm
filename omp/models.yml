# One Ollama server, two entries - `api` is a provider-level field that
# `modelOverrides` cannot override, and `extraBody` (the only way to turn Qwen
# thinking off) is applied on the chat-completions path only. Coding wants
# thinking on, summaries and background work want it off, so the split is the
# schema's, not a preference.
providers:
  ollama:
    baseUrl: http://127.0.0.1:11434/v1
    api: openai-responses
    auth: none
    discovery:
      type: ollama
    # 창은 손으로 박는다 - discovery 캐시가 재해석마다 128000 폴백으로 되돌아가
    # Modelfile num_ctx와 어긋난 적이 있다(세션 기록 `22% / 28200` = 128k).
    modelOverrides:
      qwen3.6-coder:latest:
        # 131072 / 8192 - Modelfile과 같은 값. 근거는 Modelfile.qwen3.6-coder 주석
        # (장기 세션 실측: 64K는 수요 58K~128K를 못 담아 7턴에 멈추고 66K는 압축 5회로
        # 지시를 잃었다. 128K부터 압축 0회. 256K는 이득 없이 시간만 1.8배).
        contextWindow: 131072
        # 출력 예약. qwen은 8K로 충분했다(모델마다 다르다 - Ornith는 33K가 필요했다).
        # Modelfile num_predict와 같은 값이어야 한다.
        maxTokens: 8192
        compactionModel: ollama-nothink/qwen3.6-coder:latest
      qwen3.8-coder:latest:
        # 3.6과 같은 coder 레시피. 이전 32768은 co-residency를 위한 값이었고, 통합 과제
        # 수요(58K~128K)를 담지 못해 모델이 아니라 창을 재게 만들었다.
        contextWindow: 131072
        maxTokens: 8192
        compactionModel: ollama-nothink/qwen3.8-coder:latest
      qwen3-coder:latest:
        # Qwen3-Coder-30B-A3B-Instruct. thinking capability 가 없어서 압축도 같은
        # 슬롯의 nothink 경로를 쓸 이유가 없지만, 일관성을 위해 같은 형태로 둔다.
        contextWindow: 131072
        maxTokens: 8192
        compactionModel: ollama-nothink/qwen3-coder:latest

  # Every call here is a call that must not think: session titles, memory
  # queries, thinking classification (4B), and compaction summaries (the coder
  # itself, same loaded slot - only the path differs, so summaries keep 35B
  # quality). 예전 주석은 "Ollama ignores every switch except reasoning_effort:
  # none" 이었으나 0.32.14 에서는 더 이상 사실이 아니다 - 실측(2026-08-24,
  # qwen3.8-coder, 동일 프롬프트): none 5 토큰 / medium 949 / 미지정 1024 / high 2502.
  # 강도는 이제 실제로 먹는다. 이 분리가 남아 있는 이유는 그것과 무관하다:
  # extraBody 가 chat-completions 경로에만 적용되고 `api` 는 modelOverrides 로
  # 덮을 수 없어서, thinking off 를 보장하려면 provider 를 따로 두는 수밖에 없다.
  ollama-nothink:
    baseUrl: http://127.0.0.1:11434/v1
    api: openai-completions
    auth: none
    compat:
      extraBody:
        reasoning_effort: none
    models:
      - id: qwen3.6-coder:latest
        contextWindow: 131072
        maxTokens: 4096
      # 4096 은 압축 요약 몫이다. 이 항목은 그 용도에 더해 "thinking 을 끈 코더"로도
      # 직접 쓰이므로 출력은 코더와 같은 8192 로 둔다 - 시드 필드 마이그레이션 한 장이
      # 3~4K 토큰이라 4096 이면 잘리고, 그러면 모델이 아니라 잘림을 재게 된다.
      - id: qwen3.8-coder:latest
        contextWindow: 131072
        maxTokens: 8192
      - id: qwen3-coder:latest
        contextWindow: 131072
        maxTokens: 8192
      - id: qwen3.5-aux:latest
        contextWindow: 8192
        maxTokens: 1024

  # oMLX (MLX 네이티브 서버, 포트 8000, 2026-08-24 도입). Ollama 와 달리 thinking 이
  # 서버쪽 per-model/프로파일 설정이라 provider 를 둘로 쪼갤 필요가 없다:
  #  - :mtp      = coder 레시피 + MTP speculative decoding, thinking on (omlx/model_profiles.json)
  #  - :nothink  = 같은 엔진 슬롯에서 thinking off - 압축 요약용
  # 모델 id 는 oMLX 앱 스토어(~/.omlx/models) 의 짧은 서빙 id(2026-08-28 전면 포팅 — HF 캐시 제거).
  omlx:
    baseUrl: http://127.0.0.1:9090/v1
    api: openai-responses
    auth: none
    models:
      - id: "Qwen3.6-35B-A3B-5bit:mtp"
        api: openai-completions  # 실험: openai-responses 에선 compat.extraBody 가 안 실린다(실측, 2026-08-24)
        contextWindow: 131072
        maxTokens: 8192
      - id: "Qwen3.6-35B-A3B-5bit:nothink"
        contextWindow: 131072
        maxTokens: 8192
      - id: "Qwen3.5-4B-4bit"  # aux(tiny). 4B+MTP 드래프터 페어링 유지(45.3 tok/s 실측) — 코더 실험은 2026-08-28 기각
        contextWindow: 8192
        maxTokens: 1024
      # 2026-08-25 배제·캐시 삭제한 실험 모델들(bench/ 기록에 근거 유지):
      #  - 로스터 비-Qwen 5모델(Gemma×3·Devstral·Qwen3-Coder-30B): 양쪽 게이트 초록 실패(roster.md)
      #  - GLM-4.7-Flash-4bit: integration 45분 타임아웃 FAIL(writes 26), 3.6 대비 느리고 미완주
      #  - Qwen3.6-35B-A3B-4bit(+MTP-4bit): 기각(2026-08-27) — 웜 70.2 tok/s 로 5bit 동급 이하, 45m TO+회귀 1(coder-4bit.md)
      #  - Qwen3.8 dense 27B(nvfp4·oQ6·표준4bit): 전부 writes 0(에이전트 루프에서 파일 미생성, 양자화 무관)
      # 코더는 3.6:mtp 유지. 실험 재개 시 install.sh 로 재다운로드.
    modelOverrides:
      "Qwen3.6-35B-A3B-5bit:mtp":
        compactionModel: "omlx/Qwen3.6-35B-A3B-5bit:nothink"
        # 실측(2026-08-24): reasoning_effort는 3.6 template에서 완전 no-op(seed 고정
        # A/B로 확인, low/high 완전 동일). thinking_budget만 실제로 먹는다(64→3000에서
        # 토큰·시간이 비례 반응). 프로필 파일(model_profiles.json)에는 안 먹혀서
        # (finish_reason=length로 8192까지 밀림) extraBody로 요청마다 강제한다.
        # 값 2048 은 2026-08-28 스윕 실측 승자(bench/2026-08-28.s2.thinkbudget.md):
        # 5120 대비 2/2 초록·유일 scored green 38.6m, 1024 는 게이트 회피로 하한 초과.
        # thinking 블록이 절반으로 얇아지고 턴 수로 보상되는 패턴 — 종반 품질 유지에 유리.
        compat:
          extraBody:
            thinking_budget: 2048
