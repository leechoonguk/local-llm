# One Ollama server, two entries - `api` is a provider-level field that
# `modelOverrides` cannot override, and `extraBody` (the only way to turn Qwen
# thinking off) is applied on the chat-completions path only. Coding wants
# thinking on, summaries and background work want it off, so the split is the
# schema's, not a preference.
providers:
  ollama:
    baseUrl: http://127.0.0.1:11434/v1
    api: openai-responses
    auth: none
    discovery:
      type: ollama
    # 창을 손으로 박는다. discovery는 `/api/show`의 `num_ctx`를 정확히 읽지만,
    # 라이브 캐시는 재해석마다 문서화된 폴백(128000)으로 되돌아간다 - 실행 중인
    # 세션에서 `22% / 28200 토큰`이 기록됐고, 28200/0.22 = 128k다. 그 숫자를 믿으면
    # omp가 65536을 넘겨 컨텍스트를 채우고 프로바이더 오류로 떨어진다.
    modelOverrides:
      qwen3.6-coder:latest:
        contextWindow: 65536
        # 출력 예약이 창의 절반을 먹는다. Modelfile이 `num_predict 32768`을
        # `num_ctx 65536`에 걸어두므로, 프롬프트가 32.7K를 넘는 순간 ollama가
        # 요청을 거부한다 - 실측: 도구를 쓰는 긴 턴이 35,676 토큰에서
        # `Request was aborted`로 죽었고, 22K/25K/30K/32K까지는 정상이었다.
        # 에이전트 턴은 8K 이상을 한 번에 생성하지 않으니 나머지를 컨텍스트로
        # 돌린다.
        maxTokens: 8192
        compactionModel: ollama-nothink/qwen3.6-coder:latest
      qwen3.8-coder:latest:
        contextWindow: 32768
      # Ornith-1.5-35B-A3B Q5_K_M. qwen35moe와 같은 아키텍처라 창·예약·압축 경로를
      # 그대로 쓴다. 실측(2026-08-23, 단일 로드): 정답률은 qwen3.6-coder와 동률,
      # 추론 토큰이 훨씬 짧아 응답 시간 2~5배 단축. 토큰 속도는 GGUF라 ~35% 느리다.
      ornith-coder-q5:latest:
        contextWindow: 65536
        maxTokens: 8192
        compactionModel: ollama-nothink/ornith-coder-q5:latest

  # Every call here is a call that must not think: session titles, memory
  # queries, thinking classification (4B), and compaction summaries (the coder
  # itself, same loaded slot - only the path differs, so summaries keep 35B
  # quality). Ollama ignores every switch except `reasoning_effort: none`.
  ollama-nothink:
    baseUrl: http://127.0.0.1:11434/v1
    api: openai-completions
    auth: none
    compat:
      extraBody:
        reasoning_effort: none
    models:
      - id: qwen3.6-coder:latest
        contextWindow: 65536
        maxTokens: 4096
      - id: ornith-coder-q5:latest
        contextWindow: 65536
        maxTokens: 4096
      - id: qwen3.5-aux:latest
        contextWindow: 8192
        maxTokens: 1024
