# Ollama 쪽은 thinking on 하나만 남았다. 예전에는 `ollama` / `ollama-nothink` 두 벌이었고,
# 그 분리는 취향이 아니라 스키마 제약이었다 — `api` 는 provider 레벨 필드라 `modelOverrides`
# 로 덮을 수 없고, thinking 을 끄는 유일한 수단인 `extraBody` 는 chat-completions 경로에만
# 실린다. 그 nothink 벌은 2026-08-31 제거했다: 존재 이유였던 압축 요약 경로가 compactionModel
# 과 함께 죽었고(아래 참조), Ollama 자체가 이 호스트에서 미설치라 호출이 닿지도 않는다.
# 되살려야 하면 git 이력에서 그대로 꺼낸다.
# compactionModel 은 2026-08-30 제거했다 — omp 런타임에 그런 키가 없다(dist 전수 검색 0건).
# 압축은 `compact(preparation, this.model, …, this.thinkingLevel, …)`(core/agent-session.js:1328,1562)로
# **현재 세션 모델·현재 thinking 레벨** 그대로 수행된다. 즉 "압축은 nothink 로 돈다"는 우리 가정은
# 사실이 아니었고, 그 설정은 아무도 읽지 않았다. 공식 문서가 노출하는 압축 설정은
# compaction.enabled / reserveTokens(기본 16384) / keepRecentTokens(기본 20000) 뿐이다(docs/compaction.md).
providers:
  ollama:
    baseUrl: http://127.0.0.1:11434/v1
    api: openai-responses
    auth: none
    discovery:
      type: ollama
    # 창은 손으로 박는다 - discovery 캐시가 재해석마다 128000 폴백으로 되돌아가
    # Modelfile num_ctx와 어긋난 적이 있다(세션 기록 `22% / 28200` = 128k).
    modelOverrides:
      qwen3.6-coder:latest:
        # 131072 / 8192 - Modelfile과 같은 값. 근거는 Modelfile.qwen3.6-coder 주석
        # (장기 세션 실측: 64K는 수요 58K~128K를 못 담아 7턴에 멈추고 66K는 압축 5회로
        # 지시를 잃었다. 128K부터 압축 0회. 256K는 이득 없이 시간만 1.8배).
        contextWindow: 131072
        # 출력 예약. qwen은 8K로 충분했다(모델마다 다르다 - Ornith는 33K가 필요했다).
        # Modelfile num_predict와 같은 값이어야 한다.
        maxTokens: 8192
      qwen3.8-coder:latest:
        # 3.6과 같은 coder 레시피. 이전 32768은 co-residency를 위한 값이었고, 통합 과제
        # 수요(58K~128K)를 담지 못해 모델이 아니라 창을 재게 만들었다.
        contextWindow: 131072
        maxTokens: 8192
      qwen3-coder:latest:
        # Qwen3-Coder-30B-A3B-Instruct. thinking capability 가 없어서 압축도 같은
        # 슬롯의 nothink 경로를 쓸 이유가 없지만, 일관성을 위해 같은 형태로 둔다.
        contextWindow: 131072
        maxTokens: 8192

  # oMLX (MLX 네이티브 서버, 포트 8000, 2026-08-24 도입). Ollama 와 달리 thinking 이
  # 서버쪽 per-model/프로파일 설정이라 provider 를 둘로 쪼갤 필요가 없다:
  #  - :coder   = coder 레시피(131072/8192) + thinking budget 2048, MTP off (omlx/model_profiles.json)
  #  - :coding  = 3.8-27B(dense)의 같은 레시피. 3.8 template 은 reasoning_effort 를 네이티브로
  #               읽고 기본이 xhigh 라 서버쪽에서 medium 으로 고정했다(omlx/model_settings.json).
  # :nothink 는 2026-08-31 제거했다 - 존재 이유가 "압축 요약용" 하나였는데 compactionModel 이
  # 죽은 키로 판명나(아래 주석) 아무도 그 엔트리를 부르지 않았다. 프로파일 자체는 oMLX 에 남아 있다.
  # 모델 id 는 oMLX 앱 스토어(~/.omlx/models) 의 짧은 서빙 id(2026-08-28 전면 포팅 — HF 캐시 제거).
  omlx:
    baseUrl: http://127.0.0.1:9090/v1
    api: openai-responses
    auth: none
    models:
      - id: "Qwen3.6-35B-A3B-5bit:coder"
        api: openai-completions  # 실험: openai-responses 에선 compat.extraBody 가 안 실린다(실측, 2026-08-24)
        contextWindow: 131072
        maxTokens: 8192
      # 3.8 dense 27B(4bit, 15GB). 2026-08-25 에 한 번 배제된 계열이지만(nvfp4·oQ6·표준4bit 전부
      # writes 0) 사용자 요청으로 2026-08-31 재등록 - 기본 코더는 3.6 그대로이고 이건 선택지다.
      # 샘플링은 모델 카드 generation_config.json(temperature 1.0 / top_p 0.95 / top_k 20) -
      # 3.6(0.6)과 다르다. 창 용량은 262144 이지만 coder 레시피에 맞춰 131072 로 둔다.
      - id: "Qwen3.8-27B-4bit:coding"
        contextWindow: 131072
        maxTokens: 8192
      - id: "Qwen3.5-4B-4bit"  # aux(tiny). 4B+MTP 드래프터 페어링 유지(45.3 tok/s 실측) — 코더 실험은 2026-08-28 기각
        contextWindow: 8192
        maxTokens: 1024
      # 2026-08-25 배제·캐시 삭제한 실험 모델들(bench/ 기록에 근거 유지):
      #  - 로스터 비-Qwen 5모델(Gemma×3·Devstral·Qwen3-Coder-30B): 양쪽 게이트 초록 실패(roster.md)
      #  - GLM-4.7-Flash-4bit: integration 45분 타임아웃 FAIL(writes 26), 3.6 대비 느리고 미완주
      #  - Qwen3.6-35B-A3B-4bit(+MTP-4bit): 기각(2026-08-27) — 웜 70.2 tok/s 로 5bit 동급 이하, 45m TO+회귀 1(coder-4bit.md)
      #  - Qwen3.8 dense 27B(nvfp4·oQ6·표준4bit): 전부 writes 0(에이전트 루프에서 파일 미생성, 양자화 무관)
      # 코더는 3.6:mtp 유지. 실험 재개 시 install.sh 로 재다운로드.
    modelOverrides:
      "Qwen3.6-35B-A3B-5bit:coder":
        # 실측(2026-08-24): reasoning_effort는 3.6 template에서 완전 no-op(seed 고정
        # A/B로 확인, low/high 완전 동일). thinking_budget만 실제로 먹는다(64→3000에서
        # 토큰·시간이 비례 반응). **2026-08-28 정정**: "프로파일 파일엔 안 먹힌다"던 옛
        # 결론은 키 이름 오류였다 — 요청 레벨 필드는 `thinking_budget`(이 extraBody)지만
        # 모델 설정/프로파일 레벨은 `thinking_budget_enabled`+`thinking_budget_tokens` 다
        # (oMLX openapi ModelSettingsRequest). 서버 쪽도 2048 로 맞춰 뒀고(omlx/*.json),
        # 이 extraBody 는 요청 단위 이중 보장으로 남긴다.
        # 값 2048 은 2026-08-28 스윕 실측 승자(bench/2026-08-28.s2.thinkbudget.md):
        # 5120 대비 2/2 초록·유일 scored green 38.6m, 1024 는 게이트 회피로 하한 초과.
        # thinking 블록이 절반으로 얇아지고 턴 수로 보상되는 패턴 — 종반 품질 유지에 유리.
        # nobudget A/B 결론(2026-08-28, bench/2026-08-28.s2.nobudget.md): budget 을 빼면
        # MTP 가 살아나 토큰당 +15%(44.1 vs 38.3 tok/s) 지만 무제한 thinking 이 토큰을
        # +38% 써서 벽시계는 손해였다(50분 캡 TO vs 41.6분 자체종료). budget 유지가 정답.
        compat:
          extraBody:
            thinking_budget: 2048
