# Ollama 쪽은 thinking on 하나만 남았다. 예전에는 `ollama` / `ollama-nothink` 두 벌이었고,
# 그 분리는 취향이 아니라 스키마 제약이었다 — `api` 는 provider 레벨 필드라 `modelOverrides`
# 로 덮을 수 없고, thinking 을 끄는 유일한 수단인 `extraBody` 는 chat-completions 경로에만
# 실린다. 그 nothink 벌은 2026-08-31 제거했다: 존재 이유였던 압축 요약 경로가 compactionModel
# 과 함께 죽었고(아래 참조), Ollama 자체가 이 호스트에서 미설치라 호출이 닿지도 않는다.
# 되살려야 하면 git 이력에서 그대로 꺼낸다.
# compactionModel 은 2026-08-30 제거했다 — omp 런타임에 그런 키가 없다(dist 전수 검색 0건).
# 압축은 `compact(preparation, this.model, …, this.thinkingLevel, …)`(core/agent-session.js:1328,1562)로
# **현재 세션 모델·현재 thinking 레벨** 그대로 수행된다. 즉 "압축은 nothink 로 돈다"는 우리 가정은
# 사실이 아니었고, 그 설정은 아무도 읽지 않았다. 공식 문서가 노출하는 압축 설정은
# compaction.enabled / reserveTokens(기본 16384) / keepRecentTokens(기본 20000) 뿐이다(docs/compaction.md).
providers:
  ollama:
    baseUrl: http://127.0.0.1:11434/v1
    api: openai-responses
    auth: none
    discovery:
      type: ollama
    # 창은 손으로 박는다 - discovery 캐시가 재해석마다 128000 폴백으로 되돌아가
    # Modelfile num_ctx와 어긋난 적이 있다(세션 기록 `22% / 28200` = 128k).
    modelOverrides:
      qwen3.6-coder:latest:
        # 131072 / 8192 - Modelfile과 같은 값. 근거는 Modelfile.qwen3.6-coder 주석
        # (장기 세션 실측: 64K는 수요 58K~128K를 못 담아 7턴에 멈추고 66K는 압축 5회로
        # 지시를 잃었다. 128K부터 압축 0회. 256K는 이득 없이 시간만 1.8배).
        contextWindow: 131072
        # 출력 예약. qwen은 8K로 충분했다(모델마다 다르다 - Ornith는 33K가 필요했다).
        # Modelfile num_predict와 같은 값이어야 한다.
        maxTokens: 8192
      qwen3.8-coder:latest:
        # 3.6과 같은 coder 레시피. 이전 32768은 co-residency를 위한 값이었고, 통합 과제
        # 수요(58K~128K)를 담지 못해 모델이 아니라 창을 재게 만들었다.
        contextWindow: 131072
        maxTokens: 8192
      qwen3-coder:latest:
        # Qwen3-Coder-30B-A3B-Instruct. thinking capability 가 없어서 압축도 같은
        # 슬롯의 nothink 경로를 쓸 이유가 없지만, 일관성을 위해 같은 형태로 둔다.
        contextWindow: 131072
        maxTokens: 8192

  # oMLX (MLX 네이티브 서버, 포트 9090, 2026-08-24 도입).
  #
  # **모델 목록을 손으로 적지 않는다**(2026-08-31). `openai-models-list` discovery 가 서버의
  # `/v1/models` 를 그대로 읽는다 — oMLX 는 항목마다 `max_model_len` 을 실어 주므로 창 크기도
  # 서버가 말하는 값이다. 앱에서 모델을 받거나 지우면 omp 목록이 따라온다.
  #
  # 프로파일 suffix(`:coder`) 도 쓰지 않는다. oMLX 는 model_settings 의 `active_profile_name`
  # 을 bare id 에 그대로 적용한다(admin/api/models 로 확인: `Qwen3.6-35B-A3B-5bit` 가
  # active_profile coder·ctx 131072·budget 2048). 그래서 서빙 id 는 모델당 하나면 되고,
  # 레시피 변경은 omlx/model_settings.json·model_profiles.json 한 곳에서 끝난다.
  # `:nothink` 는 2026-08-31 제거했다 — 압축 요약이 존재 이유였는데 `compactionModel` 이
  # omp 에 없는 키로 판명나(아래 주석) 그 분기가 애초에 돌지 않았다.
  omlx:
    baseUrl: http://127.0.0.1:9090/v1
    api: openai-responses
    auth: none
    discovery:
      type: openai-models-list
    # 목록은 서버가 준다. 여기 있는 것은 **모델 목록이 아니라 레시피 고정값**이다 —
    # `/v1/models` 는 `max_model_len`(창)만 싣고 출력 상한은 안 싣는다. 그대로 두면 omp 가
    # 창의 1/4(33K)을 출력으로 예약해 입력 상한이 123K→98K 로 줄고, 규칙 4(omp maxTokens =
    # 서빙 max_tokens)도 깨진다. 여기 없는 모델은 자동으로 발견되고 기본값으로 돈다.
    modelOverrides:
      Qwen3.6-35B-A3B-5bit:      # 기본 코더
        maxTokens: 8192
        # 창을 서버(131072)보다 낮게 박는 이유(2026-09-01 실측 OOM 2회): ① ctx 107k 프리필
        # 중단(54.0 > hard 50.9GB), ② 창 98304 에서도 ctx 83.5k 프리필 중단(53.6 > hard 53.2GB —
        # hard 문턱은 상주량에 따라 움직인다). 압축 자체는 정상(mid-run 83k·87.7k 적용 실물)이나
        # 문턱 = 창 − reserve(16384) = 81920 이라 중단점 83.5k 와 마진이 1.6k 뿐 — 605초 대량
        # 병렬 출력 턴 하나(+8k)를 못 견딘다. 81920 이면 문턱 65536, 실측 중단점 대비 ~18k 마진.
        contextWindow: 81920
      Qwen3.8-27B-4bit:
        maxTokens: 8192
      gemma-4-26b-a4b-it-5bit:
        maxTokens: 8192
      Qwen3.5-4B-4bit:           # aux(tiny)
        maxTokens: 1024
