# ~/.omp/agent/config.yml 에 병합할 조각. install.sh는 이 파일을 덮어쓰지 않고
# 키 존재만 확인한다 - config.yml에는 omp 자신이 쓰는 값(setupVersion, theme,
# 모델 셀렉터가 저장하는 역할 배정)이 함께 살기 때문이다.
#
# models.yml 은 전부 우리 것이라 install.sh가 그대로 설치한다.
modelRoles:
  # 코딩 본체. 같은 Qwen3.6-35B-A3B 를 oMLX(5bit MLX)로 서빙 - 2026-08-24 Ollama 서비스
  # 중단 후 전환. :mtp 프로파일 = 창 131072 / 출력 8192 + MTP speculative decoding.
  default: omlx/Qwen3.6-35B-A3B-5bit:mtp
  # 제목·메모리·사고강도 분류·비정상 종료 감지. 4B, 창 8192, thinking off
  # (oMLX model_settings.json 에서 enable_thinking: false).
  # `smol`이 아니라 `tiny`여야 한다 - README 참고(prewalk 타깃).
  tiny: omlx/Qwen3.5-4B-4bit

# 사고 강도를 medium 으로 고정한다. `auto` 는 tiny 모델이 턴마다 강도를 분류해서
# 정하는데, 그것이 벤치 결과의 변동성 원천이었다 - 같은 과제·같은 모델로 6/6, 0/6,
# 4/6 이 나왔고 0/6 은 파일 74개를 읽고 하나도 쓰지 않은 실행이었다.
# 실측(2026-08-24, qwen3.8-coder, ollama 0.32.14, 같은 프롬프트):
#   none 5 토큰 1.5s / medium 949 토큰 37s / 필드없음 1024 토큰 41s / high 2502 토큰 117s
# high 는 medium 의 2.6배 토큰, 2.8배 시간이다. 코딩 과제에서 그만큼의 숙고가
# 결과를 바꾼다는 증거는 아직 없고, 시간과 창은 확실히 먹는다.
defaultThinkingLevel: medium

# 어드바이저(선택). 2026-08-28 실측: 헤드리스에서도 실동하지만 벤치 조합은 기각
# (bench/2026-08-28.s2.advmatrix.md — MoE 속도 역전으로 소형 코더 전제 붕괴).
# 인터랙티브에서 쓰려면 아래 두 줄이면 된다(WATCHDOG.yml 불필요):
#   modelRoles.advisor: omlx/Qwen3.6-35B-A3B-5bit:nothink   # 코더와 같은 엔진 슬롯 = 추가 상주 0
#   advisor.enabled: true                                    # TUI 는 /advisor on|off|status
# 조언 실물은 실전급이었다(재독 처닝 지적) — 켜고 끄기는 취향.
advisor:
  enabled: false
